<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glints Filter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #FFFDF8;
            --surface-color: #FFFEFD;
            --primary-color: #D31611;
            --text-main: #18181B;
            --border-light: #DCDBD7;
            --border-strong: #18181B;
            --accent: #EBDBB7;
        }

        body {
            font-family: 'Geist', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 400px;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: left;
            margin-bottom: 32px;
            margin-top: 16px;
        }

        .header h1 {
            font-size: 30px;
            margin: 0;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
        }

        input {
            flex: 1;
            background-color: #FFFFFF;
            border: 1px solid var(--border-strong);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: box-shadow 0.2s ease;
            font-family: inherit;
        }

        input:focus {
            box-shadow: 0 0 0 2px var(--accent);
        }

        button.action-btn {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: 1px solid var(--border-strong);
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: opacity 0.2s ease;
            white-space: nowrap;
            font-family: inherit;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }

        button.action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .list-container {
            background-color: var(--surface-color);
            border-radius: 8px;
            border: 1px solid var(--border-light);
            overflow: hidden;
        }

        .list-header {
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-light);
            background-color: var(--accent);
            text-align: center;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 280px;
            overflow-y: auto;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--surface-color);
        }

        li:last-child {
            border-bottom: none;
        }

        .company-name {
            font-size: 16px;
            font-weight: 500;
            word-break: break-all;
            color: var(--text-main);
        }

        .delete-btn {
            background: none;
            border: 1px solid transparent;
            padding: 6px;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            border-color: var(--border-strong);
            color: var(--primary-color);
            background-color: var(--bg-color);
        }

        .empty-state {
            padding: 32px 16px;
            text-align: center;
            color: var(--text-main);
            font-size: 16px;
            background-color: var(--surface-color);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-strong);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Glints Filter</h1>
    </div>

    <div>
        <div class="input-group">
            <input type="text" id="companyInput" placeholder="Nama Perusahaan atau Posisi" autocomplete="off">
            <button id="addBtn" class="action-btn">Blokir</button>
        </div>

        <div class="list-container">
            <div class="list-header">Daftar Diblokir</div>
            <ul id="companyList">
                <!-- Items injected by JS -->
            </ul>
            <div id="emptyState" class="empty-state" style="display: none;">
                Belum ada perusahaan yang diblokir.
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
